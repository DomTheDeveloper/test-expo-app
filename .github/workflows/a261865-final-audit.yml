name: A261865 external final audit

on:
  push:
    branches: [a261865-final-audit-scratch]
    paths:
      - '.github/workflows/a261865-final-audit.yml'
  pull_request:
    branches: [claude/react-native-expo-ghpages-pgXVQ]
    paths:
      - '.github/workflows/a261865-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a261865-external-final-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact proof head
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch a261865-research \
            https://github.com/DomTheDeveloper/formal-conjectures.git proof
          cd proof
          test "$(git rev-parse HEAD)" = "6f05943953af5d1276ea29c00e36020bf2b0c813"

      - name: Install Lean 4.27
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.27.0

      - name: Fetch Mathlib cache
        shell: bash
        working-directory: proof
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee ../cache.log

      - name: Compile exact theorem and audit axioms
        shell: bash
        working-directory: proof
        run: |
          set -o pipefail
          lake env lean FormalConjectures/OEIS/261865FinalAudit.lean 2>&1 | tee ../lean-final.log
          ! grep -q sorryAx ../lean-final.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a261865-external-final-audit
          path: |
            cache.log
            lean-final.log
          if-no-files-found: ignore
